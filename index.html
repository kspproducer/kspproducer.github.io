<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KSP</title>
<meta name="description" content="KSP — producer. Every number has a story.">
<meta property="og:title" content="KSP">
<meta property="og:description" content="Every number has a story. Beats for rappers · prod. KSP">
<meta property="og:image" content="https://kspproducer.github.io/ksp.jpg">
<meta property="og:url" content="https://kspproducer.github.io/">
<meta name="theme-color" content="#0a0a0b">
<link rel="icon" href="ksp.jpg">
<style>
  :root { --bg: #0a0a0b; --fg: #f2f2f2; --muted: #8d8d92; --line: rgba(255,255,255,.16); --card: rgba(255,255,255,.04); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; min-height: 100vh; display: flex; justify-content: center; padding: 48px 16px 32px; -webkit-font-smoothing: antialiased; }
  main { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; }
  .avatar { width: 112px; height: 112px; border-radius: 50%; object-fit: cover; border: 1px solid var(--line); background: #fff; }
  h1 { margin-top: 18px; font-size: 26px; font-weight: 700; letter-spacing: .12em; }
  .handle { margin-top: 4px; color: var(--muted); font-size: 14px; }
  .tag { margin-top: 14px; font-size: 15px; text-align: center; }
  nav { width: 100%; margin-top: 32px; display: flex; flex-direction: column; gap: 12px; }
  nav a { display: block; text-align: center; padding: 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--fg); text-decoration: none; font-size: 14px; font-weight: 600; letter-spacing: .14em; transition: background .2s, border-color .2s; }
  nav a:hover, nav a:focus-visible { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.35); }
  footer { margin-top: 36px; color: var(--muted); font-size: 12px; letter-spacing: .08em; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <img class="avatar" src="ksp.jpg" alt="KSP" width="112" height="112">
  <h1>KSP</h1>
  <p class="handle">@ksp.producer</p>
  <p class="tag">Every number has a story.</p>

  <nav>
    <a href="https://www.beatstars.com/kspproducer">BEATSTARS</a>
    <a href="https://open.spotify.com/artist/3qJAU8LgyeLvb1U3sAg0jn">SPOTIFY</a>
    <a href="https://www.instagram.com/ksp.producer/">INSTAGRAM</a>
    <a href="https://www.youtube.com/@ksp.producer">YOUTUBE</a>
    <a href="https://www.tiktok.com/@ksp.producer">TIKTOK</a>
  </nav>

  <footer><a href="mailto:ksp.producer@gmail.com">ksp.producer@gmail.com</a></footer>
</main>
</body>
</html>
